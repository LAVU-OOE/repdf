<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PWA Multi-Page PDF Signer</title>
  
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- pdf-lib -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- SignaturePad -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121214;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height for mobile browsers */
      overflow: hidden;
    }
    header {
      padding: 0.75rem 1rem;
      background: #1f2023;
      border-bottom: 1px solid #2e3035;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      z-index: 10;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button, label.file-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled, label.file-btn.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }
    input[type="file"] {
      display: none;
    }
    main {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
      background: #18181b;
    }
    /* Flexible Responsive Canvas Container */
    #pdf-wrapper {
      position: relative;
      max-width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
    }
    #pdf-canvas {
      display: block;
      width: 100%; /* Scales dynamically to parent */
      height: auto;
    }
    /* Signature Modal */
    #sig-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-content {
      background: #27272a;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    #sig-canvas {
      background: #ffffff;
      border-radius: 8px;
      width: 100%;
      height: 180px;
      touch-action: none;
    }
    .modal-actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .page-indicator {
      font-size: 14px;
      font-weight: 500;
      color: #a1a1aa;
    }
  </style>
</head>
<body>

  <header>
    <div class="btn-group">
      <label class="file-btn">
        Open PDF
        <input type="file" id="file-input" accept="application/pdf" />
      </label>
      <button id="add-sig-btn" disabled>Sign</button>
      <button id="save-btn" style="background:#16a34a;" disabled>Save</button>
    </div>

    <!-- Multi-Page Pagination Controls -->
    <div class="btn-group">
      <button id="prev-page" style="background:#3f3f46;" disabled>&lt;</button>
      <span class="page-indicator" id="page-num-display">Page 0 / 0</span>
      <button id="next-page" style="background:#3f3f46;" disabled>&gt;</button>
    </div>
  </header>

  <main>
    <div id="pdf-wrapper">
      <canvas id="pdf-canvas"></canvas>
    </div>
  </main>

  <!-- Signature Modal -->
  <div id="sig-modal">
    <div class="modal-content">
      <h3 style="margin:0;">Draw Signature</h3>
      <canvas id="sig-canvas"></canvas>
      <div class="modal-actions">
        <button id="clear-sig" style="background:#52525b;">Clear</button>
        <div class="btn-group">
          <button id="cancel-sig" style="background:#52525b;">Cancel</button>
          <button id="confirm-sig">Apply</button>
        </div>
      </div>
    </div>
  </div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let rawPdfBytes = null;
  let pdfDoc = null;
  let currentPageIndex = 1;
  let totalPages = 0;
  let signaturePad = null;
  let pendingSignatureImg = null;

  const fileInput = document.getElementById('file-input');
  const addSigBtn = document.getElementById('add-sig-btn');
  const saveBtn = document.getElementById('save-btn');
  const prevBtn = document.getElementById('prev-page');
  const nextBtn = document.getElementById('next-page');
  const pageDisplay = document.getElementById('page-num-display');
  const pdfCanvas = document.getElementById('pdf-canvas');
  
  // Modal Elements
  const sigModal = document.getElementById('sig-modal');
  const sigCanvas = document.getElementById('sig-canvas');
  const clearSigBtn = document.getElementById('clear-sig');
  const cancelSigBtn = document.getElementById('cancel-sig');
  const confirmSigBtn = document.getElementById('confirm-sig');

  // Load PDF
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    rawPdfBytes = await file.arrayBuffer();
    currentPageIndex = 1;
    await renderPdfDoc();
  });

  async function renderPdfDoc() {
    const loadingTask = pdfjsLib.getDocument({ data: rawPdfBytes });
    pdfDoc = await loadingTask.promise;
    totalPages = pdfDoc.numPages;
    
    await renderPage(currentPageIndex);
    updateControls();
  }

  async function renderPage(pageNumber) {
    const page = await pdfDoc.getPage(pageNumber);
    
    // Scale high enough for crisp text rendering on mobile high-DPI screens
    const viewport = page.getViewport({ scale: 2.0 });
    const context = pdfCanvas.getContext('2d');
    
    pdfCanvas.width = viewport.width;
    pdfCanvas.height = viewport.height;

    await page.render({ canvasContext: context, viewport: viewport }).promise;
  }

  function updateControls() {
    pageDisplay.textContent = `Page ${currentPageIndex} / ${totalPages}`;
    prevBtn.disabled = currentPageIndex <= 1;
    nextBtn.disabled = currentPageIndex >= totalPages;
    addSigBtn.disabled = false;
    saveBtn.disabled = false;
  }

  // Pagination Handlers
  prevBtn.addEventListener('click', async () => {
    if (currentPageIndex > 1) {
      currentPageIndex--;
      await renderPage(currentPageIndex);
      updateControls();
    }
  });

  nextBtn.addEventListener('click', async () => {
    if (currentPageIndex < totalPages) {
      currentPageIndex++;
      await renderPage(currentPageIndex);
      updateControls();
    }
  });

  // Modal Setup
  addSigBtn.addEventListener('click', () => {
    sigModal.style.display = 'flex';
    const rect = sigCanvas.getBoundingClientRect();
    sigCanvas.width = rect.width;
    sigCanvas.height = rect.height;
    
    if (!signaturePad) {
      signaturePad = new SignaturePad(sigCanvas, { backgroundColor: 'rgba(255, 255, 255, 0)' });
    } else {
      signaturePad.clear();
    }
  });

  clearSigBtn.addEventListener('click', () => signaturePad.clear());
  cancelSigBtn.addEventListener('click', () => sigModal.style.display = 'none');

  confirmSigBtn.addEventListener('click', () => {
    if (signaturePad.isEmpty()) return alert('Please draw a signature first.');
    
    pendingSignatureImg = signaturePad.toDataURL('image/png');
    sigModal.style.display = 'none';

    alert(`Tap anywhere on page ${currentPageIndex} to place signature.`);
    pdfCanvas.style.cursor = 'crosshair';
    pdfCanvas.addEventListener('pointerdown', handlePlaceSignature, { once: true });
  });

  // Precise Responsive Multi-Page Placement Math
  async function handlePlaceSignature(e) {
    if (!pendingSignatureImg) return;

    // Get the actual displayed CSS bounds on device screen
    const rect = pdfCanvas.getBoundingClientRect();
    
    // Calculate click coordinates relative to display size
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    // Load PDF in pdf-lib
    const pdfLibDoc = await PDFLib.PDFDocument.load(rawPdfBytes);
    
    // Select current target page (0-indexed in pdf-lib)
    const targetPage = pdfLibDoc.getPages()[currentPageIndex - 1];
    const { width: pdfWidth, height: pdfHeight } = targetPage.getSize();

    // Responsive scaling factor (Maps display CSS pixels directly to true PDF points)
    const scaleX = pdfWidth / rect.width;
    const scaleY = pdfHeight / rect.height;

    // Fixed signature size in PDF points
    const sigPdfWidth = 140;
    const sigPdfHeight = 55;

    // Calculate center placement based on click point
    const targetPdfX = (clickX * scaleX) - (sigPdfWidth / 2);
    
    // Invert Y-Axis (HTML Top-Down -> PDF Bottom-Up)
    const targetPdfY = pdfHeight - (clickY * scaleY) - (sigPdfHeight / 2);

    // Embed PNG image onto current page
    const pngImage = await pdfLibDoc.embedPng(pendingSignatureImg);
    targetPage.drawImage(pngImage, {
      x: targetPdfX,
      y: targetPdfY,
      width: sigPdfWidth,
      height: sigPdfHeight,
    });

    // Save PDF
    rawPdfBytes = await pdfLibDoc.save();

    // Re-render updated page
    await renderPdfDoc();

    pdfCanvas.style.cursor = 'default';
    pendingSignatureImg = null;
  }

  // Download Output
  saveBtn.addEventListener('click', () => {
    const blob = new Blob([rawPdfBytes], { type: 'application/pdf' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `signed_document_p${currentPageIndex}.pdf`;
    link.click();
  });
</script>
</body>
</html>
