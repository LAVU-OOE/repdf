<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PWA PDF Studio</title>
  
  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121214;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      padding: 10px 14px;
      background: #1f2023;
      border-bottom: 1px solid #2e3035;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      z-index: 10;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    button, label.file-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled, label.file-btn.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    input[type="file"] { display: none; }
    
    main {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
      background: #18181b;
      touch-action: pan-x pan-y;
    }
    
    /* PDF Container */
    #pdf-wrapper {
      position: relative;
      max-width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
      user-select: none;
    }
    #pdf-canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Placement Crosshair Mode */
    .placement-mode #pdf-canvas {
      cursor: crosshair;
      touch-action: none;
    }

    /* Interactive Draggable Overlay Box */
    #active-overlay {
      display: none;
      position: absolute;
      border: 2px dashed #2563eb;
      background: rgba(37, 99, 235, 0.12);
      cursor: move;
      touch-action: none;
      z-index: 5;
    }
    #active-overlay .overlay-content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
    }
    #active-overlay img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #active-overlay .text-preview {
      color: #000;
      font-weight: bold;
      font-size: 16px;
      white-space: nowrap;
    }
    .overlay-actions {
      position: absolute;
      top: -42px;
      right: 0;
      display: flex;
      gap: 6px;
    }
    .overlay-actions button {
      padding: 6px 10px;
      font-size: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-content {
      background: #27272a;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input[type="text"] {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      background: #18181b;
      color: white;
      font-size: 16px;
    }
    #sig-canvas {
      background: #ffffff;
      border-radius: 8px;
      width: 100%;
      height: 180px;
      touch-action: none;
    }
    .modal-actions {
      display: flex;
      justify-content: space-between;
    }
    .page-indicator {
      font-size: 14px;
      color: #a1a1aa;
    }
  </style>
</head>
<body>

  <header>
    <div class="btn-group">
      <label class="file-btn">
        Open PDF
        <input type="file" id="file-input" accept="application/pdf" />
      </label>
      <button id="add-sig-btn" disabled>+ Signature</button>
      <button id="add-text-btn" disabled>+ Text</button>
      <label class="file-btn disabled" id="img-btn-label">
        + Image
        <input type="file" id="image-input" accept="image/png, image/jpeg" disabled />
      </label>
      <button id="save-btn" style="background:#16a34a;" disabled>Download</button>
    </div>

    <div class="btn-group">
      <button id="prev-page" style="background:#3f3f46;" disabled>&lt;</button>
      <span class="page-indicator" id="page-num-display">Page 0 / 0</span>
      <button id="next-page" style="background:#3f3f46;" disabled>&gt;</button>
    </div>
  </header>

  <main>
    <div id="pdf-wrapper">
      <canvas id="pdf-canvas"></canvas>
      
      <!-- Interactive Draggable Overlay Box -->
      <div id="active-overlay">
        <div class="overlay-content" id="overlay-content"></div>
        <div class="overlay-actions">
          <button id="apply-overlay-btn" style="background:#16a34a;">Confirm</button>
          <button id="remove-overlay-btn" style="background:#dc2626;">✕</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Signature Modal -->
  <div class="modal" id="sig-modal">
    <div class="modal-content">
      <h3 style="margin:0;">Draw Signature</h3>
      <canvas id="sig-canvas"></canvas>
      <div class="modal-actions">
        <button id="clear-sig" style="background:#52525b;">Clear</button>
        <div class="btn-group">
          <button id="cancel-sig" style="background:#52525b;">Cancel</button>
          <button id="confirm-sig">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Text Input Modal -->
  <div class="modal" id="text-modal">
    <div class="modal-content">
      <h3 style="margin:0;">Add Text Annotation</h3>
      <input type="text" id="text-input-field" placeholder="Enter text..." />
      <div class="modal-actions" style="justify-content: flex-end;">
        <div class="btn-group">
          <button id="cancel-text" style="background:#52525b;">Cancel</button>
          <button id="confirm-text">Apply Text</button>
        </div>
      </div>
    </div>
  </div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let rawPdfBytes = null;
  let pdfDoc = null;
  let currentPageIndex = 1;
  let totalPages = 0;
  let signaturePad = null;

  // Active Pending Placement Object
  let pendingItem = null; // { type: 'png'|'text', dataUrl, text, width, height }
  let overlayPos = { x: 0, y: 0, width: 140, height: 60 };

  const fileInput = document.getElementById('file-input');
  const imageInput = document.getElementById('image-input');
  const imgBtnLabel = document.getElementById('img-btn-label');
  const addSigBtn = document.getElementById('add-sig-btn');
  const addTextBtn = document.getElementById('add-text-btn');
  const saveBtn = document.getElementById('save-btn');
  const prevBtn = document.getElementById('prev-page');
  const nextBtn = document.getElementById('next-page');
  const pageDisplay = document.getElementById('page-num-display');
  
  const pdfCanvas = document.getElementById('pdf-canvas');
  const pdfWrapper = document.getElementById('pdf-wrapper');
  
  const activeOverlay = document.getElementById('active-overlay');
  const overlayContent = document.getElementById('overlay-content');
  const applyOverlayBtn = document.getElementById('apply-overlay-btn');
  const removeOverlayBtn = document.getElementById('remove-overlay-btn');

  // Modals
  const sigModal = document.getElementById('sig-modal');
  const sigCanvas = document.getElementById('sig-canvas');
  const clearSigBtn = document.getElementById('clear-sig');
  const cancelSigBtn = document.getElementById('cancel-sig');
  const confirmSigBtn = document.getElementById('confirm-sig');

  const textModal = document.getElementById('text-modal');
  const textInputField = document.getElementById('text-input-field');
  const cancelTextBtn = document.getElementById('cancel-text');
  const confirmTextBtn = document.getElementById('confirm-text');

  // Load Main PDF
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    rawPdfBytes = await file.arrayBuffer();
    currentPageIndex = 1;
    await renderPdfDoc();
  });

  async function renderPdfDoc() {
    try {
      const loadingTask = pdfjsLib.getDocument({ data: rawPdfBytes.slice(0) });
      pdfDoc = await loadingTask.promise;
      totalPages = pdfDoc.numPages;
      await renderPage(currentPageIndex);
      updateControls();
    } catch (err) {
      console.error('Error rendering PDF:', err);
    }
  }

  async function renderPage(pageNumber) {
    const page = await pdfDoc.getPage(pageNumber);
    const viewport = page.getViewport({ scale: 2.0 });
    const context = pdfCanvas.getContext('2d');
    
    pdfCanvas.width = viewport.width;
    pdfCanvas.height = viewport.height;

    await page.render({ canvasContext: context, viewport: viewport }).promise;
    activeOverlay.style.display = 'none';
  }

  function updateControls() {
    pageDisplay.textContent = `Page ${currentPageIndex} / ${totalPages}`;
    prevBtn.disabled = currentPageIndex <= 1;
    nextBtn.disabled = currentPageIndex >= totalPages;
    addSigBtn.disabled = false;
    addTextBtn.disabled = false;
    imageInput.disabled = false;
    imgBtnLabel.classList.remove('disabled');
    saveBtn.disabled = false;
  }

  // Navigation
  prevBtn.addEventListener('click', async () => {
    if (currentPageIndex > 1) {
      currentPageIndex--;
      await renderPage(currentPageIndex);
      updateControls();
    }
  });

  nextBtn.addEventListener('click', async () => {
    if (currentPageIndex < totalPages) {
      currentPageIndex++;
      await renderPage(currentPageIndex);
      updateControls();
    }
  });

  // 1. SIGNATURE MODAL HANDLERS
  addSigBtn.addEventListener('click', () => {
    sigModal.style.display = 'flex';
    const rect = sigCanvas.getBoundingClientRect();
    sigCanvas.width = rect.width;
    sigCanvas.height = rect.height;
    
    if (!signaturePad) {
      signaturePad = new SignaturePad(sigCanvas, { backgroundColor: 'rgba(255, 255, 255, 0)' });
    } else {
      signaturePad.clear();
    }
  });

  clearSigBtn.addEventListener('click', () => signaturePad.clear());
  cancelSigBtn.addEventListener('click', () => sigModal.style.display = 'none');

  confirmSigBtn.addEventListener('click', () => {
    if (signaturePad.isEmpty()) return alert('Please draw a signature first.');
    
    pendingItem = {
      type: 'png',
      dataUrl: signaturePad.toDataURL('image/png'),
      width: 140,
      height: 60
    };
    sigModal.style.display = 'none';
    startPlacementMode();
  });

  // 2. TEXT MODAL HANDLERS
  addTextBtn.addEventListener('click', () => {
    textInputField.value = '';
    textModal.style.display = 'flex';
    textInputField.focus();
  });

  cancelTextBtn.addEventListener('click', () => textModal.style.display = 'none');

  confirmTextBtn.addEventListener('click', () => {
    const val = textInputField.value.trim();
    if (!val) return;

    pendingItem = {
      type: 'text',
      text: val,
      width: Math.max(100, val.length * 10),
      height: 35
    };
    textModal.style.display = 'none';
    startPlacementMode();
  });

  // 3. IMAGE INPUT HANDLER
  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      pendingItem = {
        type: 'png',
        dataUrl: event.target.result,
        width: 120,
        height: 120
      };
      startPlacementMode();
      imageInput.value = ''; // Reset input
    };
    reader.readAsDataURL(file);
  });

  // START PLACEMENT MODE
  function startPlacementMode() {
    pdfWrapper.classList.add('placement-mode');
    pdfCanvas.addEventListener('pointerdown', placeOverlay, { once: true });
  }

  function placeOverlay(e) {
    pdfWrapper.classList.remove('placement-mode');
    
    const rect = pdfCanvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    overlayPos.width = pendingItem.width;
    overlayPos.height = pendingItem.height;
    overlayPos.x = clickX - (overlayPos.width / 2);
    overlayPos.y = clickY - (overlayPos.height / 2);

    // Build Content Preview
    overlayContent.innerHTML = '';
    if (pendingItem.type === 'png') {
      const img = document.createElement('img');
      img.src = pendingItem.dataUrl;
      overlayContent.appendChild(img);
    } else if (pendingItem.type === 'text') {
      const txt = document.createElement('div');
      txt.className = 'text-preview';
      txt.textContent = pendingItem.text;
      overlayContent.appendChild(txt);
    }

    updateOverlayDOM();
    activeOverlay.style.display = 'block';
    enableDragging();
  }

  function updateOverlayDOM() {
    activeOverlay.style.left = `${overlayPos.x}px`;
    activeOverlay.style.top = `${overlayPos.y}px`;
    activeOverlay.style.width = `${overlayPos.width}px`;
    activeOverlay.style.height = `${overlayPos.height}px`;
  }

  // DRAG OVERLAY LOGIC
  function enableDragging() {
    let isDragging = false;
    let startX, startY;

    const onPointerDown = (e) => {
      if (e.target.tagName === 'BUTTON') return;
      isDragging = true;
      startX = e.clientX - overlayPos.x;
      startY = e.clientY - overlayPos.y;
      activeOverlay.setPointerCapture(e.pointerId);
    };

    const onPointerMove = (e) => {
      if (!isDragging) return;
      overlayPos.x = e.clientX - startX;
      overlayPos.y = e.clientY - startY;
      updateOverlayDOM();
    };

    const onPointerUp = (e) => {
      isDragging = false;
      try { activeOverlay.releasePointerCapture(e.pointerId); } catch(err) {}
    };

    activeOverlay.onpointerdown = onPointerDown;
    activeOverlay.onpointermove = onPointerMove;
    activeOverlay.onpointerup = onPointerUp;
  }

  removeOverlayBtn.addEventListener('click', () => {
    activeOverlay.style.display = 'none';
    pendingItem = null;
  });

  // SAFE IMAGE CLEANER (Prevents PDF-Lib saving crashes)
  function cleanPngDataUrl(dataUrl) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = img.width;
        tempCanvas.height = img.height;
        const ctx = tempCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        resolve(tempCanvas.toDataURL('image/png'));
      };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  // BAKE ANNOTATION PERMANENTLY INTO PDF
  applyOverlayBtn.addEventListener('click', async () => {
    if (!pendingItem) return;

    applyOverlayBtn.disabled = true;
    applyOverlayBtn.textContent = 'Baking...';

    try {
      const rect = pdfCanvas.getBoundingClientRect();

      const pdfLibDoc = await PDFLib.PDFDocument.load(rawPdfBytes);
      const targetPage = pdfLibDoc.getPages()[currentPageIndex - 1];
      const { width: pdfWidth, height: pdfHeight } = targetPage.getSize();

      // Screen Scale Matrix -> PDF Points
      const scaleX = pdfWidth / rect.width;
      const scaleY = pdfHeight / rect.height;

      const finalPdfX = Math.max(0, overlayPos.x * scaleX);
      const finalPdfWidth = overlayPos.width * scaleX;
      const finalPdfHeight = overlayPos.height * scaleY;
      const finalPdfY = Math.max(0, pdfHeight - ((overlayPos.y + overlayPos.height) * scaleY));

      if (pendingItem.type === 'png') {
        const cleanImgData = await cleanPngDataUrl(pendingItem.dataUrl);
        const pngImage = await pdfLibDoc.embedPng(cleanImgData);
        targetPage.drawImage(pngImage, {
          x: finalPdfX,
          y: finalPdfY,
          width: finalPdfWidth,
          height: finalPdfHeight,
        });
      } else if (pendingItem.type === 'text') {
        const font = await pdfLibDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
        targetPage.drawText(pendingItem.text, {
          x: finalPdfX,
          y: finalPdfY + (finalPdfHeight * 0.2), // Adjust offset baseline
          size: Math.max(12, 14 * scaleY),
          font: font,
          color: PDFLib.rgb(0, 0, 0),
        });
      }

      // Save updated document
      rawPdfBytes = await pdfLibDoc.save();
      
      activeOverlay.style.display = 'none';
      pendingItem = null;

      // Refresh view
      await renderPdfDoc();

    } catch (err) {
      console.error('PDF Bake Error:', err);
      alert('Error baking element onto PDF.');
    } finally {
      applyOverlayBtn.disabled = false;
      applyOverlayBtn.textContent = 'Confirm';
    }
  });

  // SAVE AND DOWNLOAD
  saveBtn.addEventListener('click', () => {
    if (!rawPdfBytes) return;
    const blob = new Blob([rawPdfBytes], { type: 'application/pdf' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `annotated_document.pdf`;
    link.click();
  });
</script>
</body>
</html>
