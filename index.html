            const addImageBtn = document.getElementById('addImageBtn');
            const imageFileInput = document.getElementById('imageFileInput');
            const drawSignatureBtn = document.getElementById('drawSignatureBtn');
            const statusText = document.getElementById('statusText');
            const statusBadge = document.getElementById('statusBadge');
            const headerDot = document.getElementById('headerDot');
            const objectListDiv = document.getElementById('objectList');

            // ─── Text Modal refs ───
            const textModalOverlay = document.getElementById('textModalOverlay');
            const textModalClose = document.getElementById('textModalClose');
            const textModalCancel = document.getElementById('textModalCancel');
            const textModalAdd = document.getElementById('textModalAdd');
            const textModalBtn = document.getElementById('textModalBtn');
            const textInputModal = document.getElementById('textInputModal');
            const sizeInputModal = document.getElementById('sizeInputModal');
            const fontSelectModal = document.getElementById('fontSelectModal');
            const colorInputModal = document.getElementById('colorInputModal');
            const bgColorInputModal = document.getElementById('bgColorInputModal');
            const coverToggleModal = document.getElementById('coverToggleModal');

            // ─── Menu Toggle ───
            const menuToggle = document.getElementById('menuToggle');
            const menuSidebar = document.getElementById('menuSidebar');
            const menuOverlay = document.getElementById('menuOverlay');
            const menuClose = document.getElementById('menuClose');

            function openMenu() {
                menuSidebar.classList.add('open');
                menuOverlay.classList.add('active');
                menuToggle.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeMenu() {
                menuSidebar.classList.remove('open');
                menuOverlay.classList.remove('active');
                menuToggle.classList.remove('active');
                document.body.style.overflow = '';
            }

            menuToggle.addEventListener('click', () => {
                if (menuSidebar.classList.contains('open')) {
                    closeMenu();
                } else {
                    openMenu();
                }
            });

            menuClose.addEventListener('click', closeMenu);
            menuOverlay.addEventListener('click', closeMenu);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && menuSidebar.classList.contains('open')) {
                    closeMenu();
                }
            });

            // ─── Text Modal ───
            let textModalEditingId = null;

            function openTextModal(editingId) {
                textModalEditingId = editingId || null;
                if (textModalEditingId !== null) {
                    const obj = objects.find(o => o.id === textModalEditingId);
                    if (obj && obj.type === 'text') {
                        textInputModal.value = obj.lines[0];
                        sizeInputModal.value = obj.size;
                        fontSelectModal.value = obj.font || 'Helvetica';
                        colorInputModal.value = obj.color || '#e74c3c';
                        bgColorInputModal.value = obj.bgColor || '#ffffff';
                        coverToggleModal.checked = obj.cover !== undefined ? obj.cover : true;
                        document.querySelector('.text-modal-title').textContent = '✏️ Edit Text';
                        textModalAdd.textContent = '🔄 Update';
                    } else {
                        textModalEditingId = null;
                        resetTextModal();
                    }
                } else {
                    resetTextModal();
                    document.querySelector('.text-modal-title').textContent = '✏️ Add Text';
                    textModalAdd.textContent = '➕ Add';
                }
                textModalOverlay.classList.add('active');
                closeMenu();
            }

            function resetTextModal() {
                textInputModal.value = 'Hello World';
                sizeInputModal.value = 24;
                fontSelectModal.value = 'Helvetica';
                colorInputModal.value = '#e74c3c';
                bgColorInputModal.value = '#ffffff';
                coverToggleModal.checked = true;
            }

            function closeTextModal() {
                textModalOverlay.classList.remove('active');
                textModalEditingId = null;
                if (editingId !== null) deselectObject();
            }

            function handleTextModalAdd() {
                const text = textInputModal.value || 'Hello';
                const size = parseFloat(sizeInputModal.value) || 24;
                const font = fontSelectModal.value;
                const color = colorInputModal.value;
                const bgColor = coverToggleModal.checked ? bgColorInputModal.value : null;
                const cover = coverToggleModal.checked;

                if (textModalEditingId !== null) {
                    const obj = objects.find(o => o.id === textModalEditingId);
                    if (obj && obj.type === 'text') {
                        const oldPage = obj.page;
                        const oldRot = obj.rotation || 0;
                        Object.assign(obj, {
                            lines: [text],
                            size,
                            font,
                            color,
                            bgColor,
                            cover,
                            page: oldPage,
                            rotation: oldRot
                        });
                    }
                } else {
                    objects.push({
                        id: idCounter++,
                        type: 'text',
                        page: currentPageIndex,
                        lines: [text],
                        x: 50,
                        y: 50,
                        size,
                        font,
                        color,
                        bgColor,
                        cover,
                        rotation: 0
                    });
                }
                closeTextModal();
                hasUnsavedChanges = true;
                renderOverlay();
            }

            textModalBtn.addEventListener('click', () => openTextModal(null));
            textModalClose.addEventListener('click', closeTextModal);
            textModalCancel.addEventListener('click', closeTextModal);
            textModalAdd.addEventListener('click', handleTextModalAdd);

            textModalOverlay.addEventListener('click', (e) => {
                if (e.target === textModalOverlay) closeTextModal();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && textModalOverlay.classList.contains('active')) {
                    closeTextModal();
                }
            });

            textInputModal.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleTextModalAdd();
            });

            // ─── Signature modal ───
            const modal = document.getElementById('signatureModal');
            const sigCanvas = document.getElementById('signatureCanvas');
            const sigCtx = sigCanvas.getContext('2d');
            const sigClearBtn = document.getElementById('signatureClearBtn');
            const sigUndoBtn = document.getElementById('signatureUndoBtn');
            const sigCancelBtn = document.getElementById('signatureCancelBtn');
            const sigConfirmBtn = document.getElementById('signatureConfirmBtn');
            const sigCloseBtn = document.getElementById('signatureModalClose');

            // ─── State ───
            let pdfFile = null;
            let pdfDoc = null;
            let pdfjsDoc = null;
            let pageCount = 0;
            let currentPageIndex = 0;
            let scale = 1.5;
            let objects = [];
            let idCounter = 0;
            let editingId = null;
            let draggingItem = null;
            let dragOffsetX = 0,
                dragOffsetY = 0;
            let dragStartX = 0,
                dragStartY = 0;
            let isRendering = false;
            let pendingRender = false;
            let pdfLoaded = false;
            let hasUnsavedChanges = false;

            let transformMode = null;
            let transformHandle = null;
            let startMouseX = 0,
                startMouseY = 0;
            let startObjX = 0,
                startObjY = 0,
                startObjW = 0,
                startObjH = 0,
                startObjRot = 0;
            let startObjSize = 24;

            let touchStartX = 0,
                touchStartY = 0;
            let touchMoved = false;
            let ignoreSwipe = false;

            // ─── Font helpers ───
            function getCanvasFont(fontName, size) {
                const map = {
                    'Helvetica': 'Arial, Helvetica, sans-serif',
                    'Helvetica-Bold': 'Arial, Helvetica, sans-serif',
                    'Helvetica-Oblique': 'Arial, Helvetica, sans-serif',
                    'Helvetica-BoldOblique': 'Arial, Helvetica, sans-serif',
                    'Times-Roman': 'Times New Roman, Times, serif',
                    'Times-Bold': 'Times New Roman, Times, serif',
                    'Times-Italic': 'Times New Roman, Times, serif',
                    'Times-BoldItalic': 'Times New Roman, Times, serif',
                    'Courier': 'Courier New, Courier, monospace',
                    'Courier-Bold': 'Courier New, Courier, monospace',
                    'Courier-Oblique': 'Courier New, Courier, monospace',
                    'Courier-BoldOblique': 'Courier New, Courier, monospace',
                    'Symbol': 'Symbol, sans-serif',
                    'ZapfDingbats': 'ZapfDingbats, sans-serif'
                };
                let weight = 'normal',
                    style = 'normal';
                const base = map[fontName] || 'Arial, sans-serif';
                if (fontName.includes('Bold')) weight = 'bold';
                if (fontName.includes('Oblique') || fontName.includes('Italic')) style = 'italic';
                return `${weight} ${style} ${size}px ${base}`;
            }

            function measureTextWidth(text, fontName, size) {
                ctx.save();
                ctx.font = getCanvasFont(fontName, size);
                const w = ctx.measureText(text).width;
                ctx.restore();
                return w;
            }

            function getTextDimensions(text, fontName, size) {
                return { width: measureTextWidth(text, fontName, size), height: size * 1.2 };
            }

            // ─── Status ───
            function setStatus(msg, good = true) {
                statusText.textContent = msg;
                statusBadge.textContent = good ? 'Ready' : 'Error';
                headerDot.style.background = good ? '#27ae60' : '#e74c3c';
                const statusEl = document.querySelector('.header-status');
                if (statusEl) {
                    statusEl.style.borderLeftColor = good ? '#27ae60' : '#e74c3c';
                }
                if (pdfLoaded) {
                    headerDot.style.display = 'none';
                    statusBadge.style.display = 'none';
                } else {
                    headerDot.style.display = 'inline-block';
                    statusBadge.style.display = 'inline';
                }
            }

            // ─── Geometry helpers ───
            function getRotatedCorners(obj) {
                const cx = obj.x + obj.width / 2;
                const cy = obj.y + obj.height / 2;
                const hw = obj.width / 2;
                const hh = obj.height / 2;
                const angle = (obj.rotation || 0) * Math.PI / 180;
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                const pts = [
                    { x: -hw, y: -hh },
                    { x: hw, y: -hh },
                    { x: hw, y: hh },
                    { x: -hw, y: hh }
                ];
                return pts.map(p => ({
                    x: cx + p.x * cos - p.y * sin,
                    y: cy + p.x * sin + p.y * cos
                }));
            }

            function getRotatedMidpoints(obj) {
                const corners = getRotatedCorners(obj);
                return [
                    { x: (corners[0].x + corners[1].x) / 2, y: (corners[0].y + corners[1].y) / 2 },
                    { x: (corners[1].x + corners[2].x) / 2, y: (corners[1].y + corners[2].y) / 2 },
                    { x: (corners[2].x + corners[3].x) / 2, y: (corners[2].y + corners[3].y) / 2 },
                    { x: (corners[3].x + corners[0].x) / 2, y: (corners[3].y + corners[0].y) / 2 }
                ];
            }

            function getRotateHandle(obj) {
                const corners = getRotatedCorners(obj);
                const topMid = { x: (corners[0].x + corners[1].x) / 2, y: (corners[0].y + corners[1].y) / 2 };
                const cx = obj.x + obj.width / 2;
                const cy = obj.y + obj.height / 2;
                const dx = topMid.x - cx;
                const dy = topMid.y - cy;
                const dist = Math.hypot(dx, dy);
                if (dist === 0) return { x: cx, y: cy - 40 };
                const s = (dist + 30) / dist;
                return { x: cx + dx * s, y: cy + dy * s };
            }

            function isPointInRotatedRect(obj, mx, my) {
                const cx = obj.x + obj.width / 2;
                const cy = obj.y + obj.height / 2;
                const hw = obj.width / 2;
                const hh = obj.height / 2;
                const angle = (obj.rotation || 0) * Math.PI / 180;
                const cos = Math.cos(-angle);
                const sin = Math.sin(-angle);
                const dx = mx - cx;
                const dy = my - cy;
                const lx = dx * cos - dy * sin;
                const ly = dx * sin + dy * cos;
                return Math.abs(lx) <= hw && Math.abs(ly) <= hh;
            }

            function drawTransformHandles(obj, w, h) {
                const corners = [
                    { x: obj.x, y: obj.y },
                    { x: obj.x + w, y: obj.y },
                    { x: obj.x + w, y: obj.y + h },
                    { x: obj.x, y: obj.y + h }
                ];
                const midpoints = [
                    { x: obj.x + w / 2, y: obj.y },
                    { x: obj.x + w, y: obj.y + h / 2 },
                    { x: obj.x + w / 2, y: obj.y + h },
                    { x: obj.x, y: obj.y + h / 2 }
                ];
                const allPoints = [...corners, ...midpoints];
                const labels = ['tl', 'tr', 'br', 'bl', 'tc', 'mr', 'bc', 'ml'];

                const rot = obj.rotation || 0;
                const cx = obj.x + w / 2;
                const cy = obj.y + h / 2;
                const angle = rot * Math.PI / 180;

                const rCorners = [
                    { x: -w / 2, y: -h / 2 },
                    { x: w / 2, y: -h / 2 },
                    { x: w / 2, y: h / 2 },
                    { x: -w / 2, y: h / 2 }
                ].map(p => ({
                    x: cx + p.x * Math.cos(angle) - p.y * Math.sin(angle),
                    y: cy + p.x * Math.sin(angle) + p.y * Math.cos(angle)
                }));

                ctx.beginPath();
                ctx.moveTo(rCorners[0].x, rCorners[0].y);
                for (let i = 1; i < 4; i++) ctx.lineTo(rCorners[i].x, rCorners[i].y);
                ctx.closePath();
                ctx.strokeStyle = '#1a4b60';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);

                const rMidpoints = [
                    { x: (rCorners[0].x + rCorners[1].x) / 2, y: (rCorners[0].y + rCorners[1].y) / 2 },
                    { x: (rCorners[1].x + rCorners[2].x) / 2, y: (rCorners[1].y + rCorners[2].y) / 2 },
                    { x: (rCorners[2].x + rCorners[3].x) / 2, y: (rCorners[2].y + rCorners[3].y) / 2 },
                    { x: (rCorners[3].x + rCorners[0].x) / 2, y: (rCorners[3].y + rCorners[0].y) / 2 }
                ];

                const handlePoints = [...rCorners, ...rMidpoints];
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#1a4b60';
                ctx.lineWidth = 1.5;
                for (let i = 0; i < handlePoints.length; i++) {
                    const p = handlePoints[i];
                    ctx.beginPath();
                    ctx.rect(p.x - 4, p.y - 4, 8, 8);
                    ctx.fill();
                    ctx.stroke();
                }

                const topMid = rMidpoints[0];
                const dx = topMid.x - cx;
                const dy = topMid.y - cy;
                const dist = Math.hypot(dx, dy);
                let rotHandleX, rotHandleY;
                if (dist === 0) {
                    rotHandleX = cx;
                    rotHandleY = cy - 40;
                } else {
                    const s = (dist + 30) / dist;
                    rotHandleX = cx + dx * s;
                    rotHandleY = cy + dy * s;
                }

                ctx.beginPath();
                ctx.arc(rotHandleX, rotHandleY, 8, 0, 2 * Math.PI);
                ctx.fillStyle = '#f39c12';
                ctx.fill();
                ctx.strokeStyle = '#1a4b60';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(topMid.x, topMid.y);
                ctx.lineTo(rotHandleX, rotHandleY);
                ctx.strokeStyle = '#1a4b60';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);

                obj._handles = {
                    corners: rCorners,
                    midpoints: rMidpoints,
                    rotHandle: { x: rotHandleX, y: rotHandleY },
                    labels: labels
                };
            }

            function getHandleAt(mx, my, obj) {
                if (!obj._handles) return null;
                const { corners, midpoints, rotHandle } = obj._handles;
                const allPoints = [...corners, ...midpoints];
                const labels = ['tl', 'tr', 'br', 'bl', 'tc', 'mr', 'bc', 'ml'];
                for (let i = 0; i < allPoints.length; i++) {
                    const p = allPoints[i];
                    if (Math.abs(mx - p.x) < 10 && Math.abs(my - p.y) < 10) {
                        return { type: 'resize', handle: labels[i] };
                    }
                }
                if (Math.abs(mx - rotHandle.x) < 12 && Math.abs(my - rotHandle.y) < 12) {
                    return { type: 'rotate' };
                }
                return null;
            }

            // ─── Render ───
            async function renderOverlay() {
                if (isRendering) { pendingRender = true; return; }
                isRendering = true;
                pendingRender = false;

                try {
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    if (!pdfjsDoc) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        isRendering = false;
                        return;
                    }

                    prevPageBtn.disabled = (currentPageIndex === 0);
                    nextPageBtn.disabled = (currentPageIndex >= pageCount - 1);

                    const page = await pdfjsDoc.getPage(currentPageIndex + 1);
                    const viewport = page.getViewport({ scale: scale });
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    const renderTask = page.render({ canvasContext: ctx, viewport: viewport });
                    await renderTask.promise;

                    ctx.save();
                    const pageObjects = objects.filter(o => o.page === currentPageIndex);

                    for (const obj of pageObjects) {
                        if (obj.type === 'text') {
                            const dims = getTextDimensions(obj.lines[0], obj.font, obj.size);
                            const w = dims.width,
                                h = dims.height;
                            const x = obj.x,
                                y = obj.y;
                            obj._computedWidth = w;
                            obj._computedHeight = h;

                            if (obj.cover && obj.bgColor) {
                                ctx.fillStyle = obj.bgColor;
                                ctx.fillRect(x, y, w, h);
                            }

                            let bc = 'rgba(26,75,96,0.2)';
                            let bw = 1,
                                dash = [];
                            if (draggingItem === obj.id) { bc = '#8b5cf6';
                                bw = 2;
                                dash = [4, 4]; } else if (editingId === obj.id) { bc = '#1a4b60';
                                bw = 2;
                                dash = []; }
                            ctx.strokeStyle = bc;
                            ctx.lineWidth = bw;
                            ctx.setLineDash(dash);
                            ctx.strokeRect(x, y, w, h);
                            ctx.setLineDash([]);

                            ctx.font = getCanvasFont(obj.font, obj.size);
                            ctx.fillStyle = obj.color || '#e74c3c';
                            ctx.textBaseline = 'top';
                            ctx.fillText(obj.lines[0], x, y);

                            if (editingId === obj.id) {
                                drawTransformHandles(obj, w, h);
                            }
                        } else if (obj.type === 'image' || obj.type === 'signature') {
                            const img = new Image();
                            img.src = obj.data;
                            await new Promise((resolve, reject) => { img.onload = resolve;
                                img.onerror = reject; });
                            const cx = obj.x + obj.width / 2;
                            const cy = obj.y + obj.height / 2;
                            ctx.save();
                            ctx.translate(cx, cy);
                            ctx.rotate((obj.rotation || 0) * Math.PI / 180);
                            ctx.drawImage(img, -obj.width / 2, -obj.height / 2, obj.width, obj.height);
                            ctx.restore();

                            if (editingId === obj.id) {
                                drawTransformHandles(obj, obj.width, obj.height);
                            }
                        }
                    }
                    ctx.restore();

                    updateObjectList();
                    const cnt = pageObjects.length;
                    const es = editingId !== null ? ' · Editing' : '';
                    setStatus(`Page ${currentPageIndex+1} of ${pageCount} · ${cnt} object(s) on page${es}`);
                } catch (err) {
                    if (err.name !== 'RenderingCancelledException') {
                        console.error(err);
                        setStatus('Render error: ' + err.message, false);
                    }
                } finally {
                    isRendering = false;
                    if (pendingRender) { pendingRender = false;
                        await renderOverlay(); }
                }
            }

            // ─── UI State ───
            function updateUIState() {
                const insertSection = document.getElementById('insertSection');
                const objectsSection = document.getElementById('objectsSection');

                if (pdfLoaded) {
                    uploadPrompt.style.display = 'none';
                    pdfView.classList.add('active');
                    insertSection.classList.remove('disabled');
                    objectsSection.classList.remove('disabled');
                    choosePdfBtn.style.display = 'none';
                    changePdfBtn.style.display = 'flex';
                    saveBtn.style.display = 'flex';
                } else {
                    uploadPrompt.style.display = 'flex';
                    pdfView.classList.remove('active');
                    insertSection.classList.add('disabled');
                    objectsSection.classList.add('disabled');
                    choosePdfBtn.style.display = 'flex';
                    changePdfBtn.style.display = 'none';
                    saveBtn.style.display = 'none';
                }
            }

            // ─── Load PDF ───
            async function loadPDF(file) {
                try {
                    pdfFile = file;
                    objects = [];
                    idCounter = 0;
                    editingId = null;
                    draggingItem = null;
                    const arrayBuffer = await file.arrayBuffer();

                    pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                    pageCount = pdfDoc.getPageCount();

                    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer.slice(0) });
                    pdfjsDoc = await loadingTask.promise;

                    currentPageIndex = 0;
                    closeMenu();

                    pdfLoaded = true;
                    hasUnsavedChanges = false;
                    updateUIState();
                    setStatus(`Loaded: ${file.name} · ${pageCount} page(s)`);
                    await renderOverlay();
                } catch (err) {
                    console.error(err);
                    alert('Failed to load PDF: ' + err.message);
                    pdfLoaded = false;
                    updateUIState();
                    setStatus('Failed to load PDF', false);
                }
            }

            // ─── Add Image ───
            function addImage(file) {
                if (!pdfDoc) { alert('Please upload a PDF first.'); return; }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    const img = new Image();
                    img.onload = function() {
                        const w = Math.min(img.width, 300);
                        const h = img.height * (w / img.width);
                        objects.push({
                            id: idCounter++,
                            type: 'image',
                            page: currentPageIndex,
                            data: dataUrl,
                            x: 50,
                            y: 50,
                            width: w,
                            height: h,
                            rotation: 0
                        });
                        hasUnsavedChanges = true;
                        renderOverlay();
                    };
                    img.src = dataUrl;
                };
                reader.readAsDataURL(file);
            }

            // ─── Signature ───
            let isDrawing = false,
                lastX = 0,
                lastY = 0;
            let sigHistory = [];

            function initSigCanvas() {
                const w = sigCanvas.parentElement.clientWidth;
                const h = sigCanvas.parentElement.clientHeight;
                sigCanvas.width = w;
                sigCanvas.height = h;
                sigCtx.fillStyle = 'white';
                sigCtx.fillRect(0, 0, w, h);
                sigCtx.strokeStyle = '#1a4b60';
                sigCtx.lineWidth = 3;
                sigCtx.lineCap = 'round';
                sigCtx.lineJoin = 'round';
                sigHistory = [];
                sigHistory.push(sigCtx.getImageData(0, 0, w, h));
            }

            function getSigCoords(e) {
                const rect = sigCanvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) * (sigCanvas.width / rect.width),
                    y: (e.clientY - rect.top) * (sigCanvas.height / rect.height)
                };
            }

            function startDrawing(e) {
                e.preventDefault();
                isDrawing = true;
                const c = getSigCoords(e);
                lastX = c.x;
                lastY = c.y;
                sigHistory.push(sigCtx.getImageData(0, 0, sigCanvas.width, sigCanvas.height));
                if (sigHistory.length > 20) sigHistory.shift();
            }

            function draw(e) {
                e.preventDefault();
                if (!isDrawing) return;
                const c = getSigCoords(e);
                sigCtx.beginPath();
                sigCtx.moveTo(lastX, lastY);
                sigCtx.lineTo(c.x, c.y);
                sigCtx.stroke();
                lastX = c.x;
                lastY = c.y;
            }

            function stopDrawing(e) { e.preventDefault();
                isDrawing = false; }

            function clearSignature() {
                sigCtx.fillStyle = 'white';
                sigCtx.fillRect(0, 0, sigCanvas.width, sigCanvas.height);
                sigHistory = [];
                sigHistory.push(sigCtx.getImageData(0, 0, sigCanvas.width, sigCanvas.height));
            }

            function undoSignature() {
                if (sigHistory.length > 1) {
                    sigHistory.pop();
                    sigCtx.putImageData(sigHistory[sigHistory.length - 1], 0, 0);
                }
            }

            function confirmSignature() {
                if (!pdfDoc) { alert('Please upload a PDF first.'); return; }
                const dataUrl = sigCanvas.toDataURL('image/png');
                const img = new Image();
                img.onload = function() {
                    const w = Math.min(img.width, 200);
                    const h = img.height * (w / img.width);
                    objects.push({
                        id: idCounter++,
                        type: 'signature',
                        page: currentPageIndex,
                        data: dataUrl,
                        x: 50,
                        y: 50,
                        width: w,
                        height: h,
                        rotation: 0
                    });
                    hasUnsavedChanges = true;
                    renderOverlay();
                    closeModal();
                };
                img.src = dataUrl;
            }

            function openModal() {
                modal.classList.add('active');
                setTimeout(initSigCanvas, 50);
                closeMenu();
            }

            function closeModal() { modal.classList.remove('active');
                isDrawing = false; }

            // ─── Edit / Delete (via object list) ───
            function startEditing(id) {
                const obj = objects.find(o => o.id === id);
                if (!obj) return;
                editingId = id;
                if (obj.type === 'text') {
                    openTextModal(id);
                    return;
                } else {
                    setStatus(`Editing ${obj.type} – drag to reposition, corners to resize, top to rotate`, true);
                }
                renderOverlay();
            }

            function deselectObject() {
                editingId = null;
                transformMode = null;
                transformHandle = null;
                renderOverlay();
            }

            function deleteObject(id) {
                if (!confirm('Delete this object?')) return;
                objects = objects.filter(o => o.id !== id);
                if (editingId === id) deselectObject();
                if (draggingItem === id) draggingItem = null;
                hasUnsavedChanges = true;
                renderOverlay();
            }

            // ─── Object List ───
            function updateObjectList() {
                const pageObjects = objects.filter(o => o.page === currentPageIndex);
                if (pageObjects.length === 0) {
                    objectListDiv.innerHTML = '<span class="empty-state">No objects</span>';
                    return;
                }
                let html = '';
                for (const obj of pageObjects) {
                    const isEditing = (obj.id === editingId);
                    let label = '',
                        dotColor = '#94a3b8';
                    if (obj.type === 'text') { label = obj.lines[0];
                        dotColor = obj.color || '#e74c3c'; } else if (obj.type === 'image') { label = '🖼️ Image';
                        dotColor = '#6cb4db'; } else if (obj.type === 'signature') { label = '✍️ Signature';
                        dotColor = '#f39c12'; }
                    html += `<span class="object-tag ${isEditing ? 'editing' : ''}">
                                <span class="dot" style="background:${dotColor};"></span>
                                ${label} (${Math.round(obj.x)}, ${Math.round(obj.y)})
                                <button class="tag-btn tag-edit" data-id="${obj.id}" title="Edit">✏️</button>
                                <button class="tag-btn tag-delete" data-id="${obj.id}" title="Delete">✕</button>
                             </span>`;
                }
                objectListDiv.innerHTML = html;
                document.querySelectorAll('.tag-edit').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        startEditing(parseInt(btn.dataset.id, 10));
                    });
                });
                document.querySelectorAll('.tag-delete').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteObject(parseInt(btn.dataset.id, 10));
                    });
                });
            }

            // ─── Save PDF ───
async function savePDF() {
    if (!pdfDoc || !pdfFile) { alert('No PDF loaded.'); return; }
    try {
        const pages = pdfDoc.getPages();

        // Map HTML dropdown values to valid PDFLib StandardFonts keys
        const fontMap = {
            'Helvetica': PDFLib.StandardFonts.Helvetica,
            'Helvetica-Bold': PDFLib.StandardFonts.HelveticaBold,
            'Helvetica-Oblique': PDFLib.StandardFonts.HelveticaOblique,
            'Helvetica-BoldOblique': PDFLib.StandardFonts.HelveticaBoldOblique,
            'Times-Roman': PDFLib.StandardFonts.TimesRoman,
            'Times-Bold': PDFLib.StandardFonts.TimesRomanBold,
            'Times-Italic': PDFLib.StandardFonts.TimesRomanItalic,
            'Times-BoldItalic': PDFLib.StandardFonts.TimesRomanBoldItalic,
            'Courier': PDFLib.StandardFonts.Courier,
            'Courier-Bold': PDFLib.StandardFonts.CourierBold,
            'Courier-Oblique': PDFLib.StandardFonts.CourierOblique,
            'Courier-BoldOblique': PDFLib.StandardFonts.CourierBoldOblique,
            'Symbol': PDFLib.StandardFonts.Symbol,
            'ZapfDingbats': PDFLib.StandardFonts.ZapfDingbats
        };

        for (const obj of objects) {
            const targetPage = pages[obj.page || 0] || pages[0];
            const { height } = targetPage.getSize();

            if (obj.type === 'text') {
                const dims = getTextDimensions(obj.lines[0], obj.font, obj.size);
                const w = dims.width, h = dims.height;
                const pdfY = height - obj.y - h;

                if (obj.cover && obj.bgColor) {
                    const rgb = hexToRgb(obj.bgColor);
                    targetPage.drawRectangle({
                        x: obj.x,
                        y: pdfY,
                        width: w,
                        height: h,
                        color: PDFLib.rgb(rgb.r, rgb.g, rgb.b),
                    });
                }
                const trgb = hexToRgb(obj.color || '#e74c3c');
                
                // Select mapped standard font or fallback to Helvetica
                const selectedFontKey = fontMap[obj.font] || PDFLib.StandardFonts.Helvetica;
                const font = await pdfDoc.embedFont(selectedFontKey);

                targetPage.drawText(obj.lines[0], {
                    x: obj.x,
                    y: pdfY + (h * 0.2), // Adjusted alignment offset
                    size: obj.size,
                    font,
                    color: PDFLib.rgb(trgb.r, trgb.g, trgb.b),
                });
            } else if (obj.type === 'image' || obj.type === 'signature') {
                const resp = await fetch(obj.data);
                const blob = await resp.blob();
                const buf = await blob.arrayBuffer();
                let img;
                if (blob.type === 'image/png') img = await pdfDoc.embedPng(buf);
                else if (blob.type === 'image/jpeg' || blob.type === 'image/jpg') img = await pdfDoc.embedJpg(buf);
                else img = await pdfDoc.embedPng(buf);

                const w = obj.width || img.width;
                const h = obj.height || img.height;
                const pdfY = height - obj.y - h;
                const rad = (obj.rotation || 0) * Math.PI / 180;

                targetPage.drawImage(img, {
                    x: obj.x,
                    y: pdfY,
                    width: w,
                    height: h,
                    rotate: PDFLib.radians(rad), // Wrapped in PDFLib.radians
                });
            }
        }

        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'edited_document.pdf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
        hasUnsavedChanges = false;
        setStatus('✅ PDF saved successfully!');
    } catch (e) {
        console.error(e);
        alert('Save failed: ' + e.message);
    }
}
            function hexToRgb(hex) {
                const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return r ? { r: parseInt(r[1], 16) / 255, g: parseInt(r[2], 16) / 255, b: parseInt(r[3], 16) / 255 } :
                { r: 0, g: 0, b: 0 };
            }

            function findObjectAt(mx, my) {
                const activeObjects = objects.filter(o => o.page === currentPageIndex);
                for (let i = activeObjects.length - 1; i >= 0; i--) {
                    const obj = activeObjects[i];
                    if (obj.type === 'text') {
                        const dims = getTextDimensions(obj.lines[0], obj.font, obj.size);
                        const w = dims.width,
                            h = dims.height;
                        if (obj.rotation && obj.rotation !== 0) {
                            if (isPointInRotatedRect({ x: obj.x, y: obj.y, width: w, height: h, rotation: obj.rotation },
                                    mx, my)) {
                                return obj;
                            }
                        } else {
                            if (mx >= obj.x && mx <= obj.x + w && my >= obj.y && my <= obj.y + h) {
                                return obj;
                            }
                        }
                    } else if (obj.type === 'image' || obj.type === 'signature') {
                        if (isPointInRotatedRect(obj, mx, my)) return obj;
                    }
                }
                return null;
            }

            // ─── Mouse Events ───
            function getCanvasCoords(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) * (canvas.width / rect.width),
                    y: (e.clientY - rect.top) * (canvas.height / rect.height)
                };
            }

            function onMouseDown(e) {
                const { x, y } = getCanvasCoords(e);
                const hitObj = findObjectAt(x, y);

                if (editingId !== null) {
                    const selectedObj = objects.find(o => o.id === editingId);
                    if (selectedObj) {
                        if (selectedObj.type === 'text') {
                            const dims = getTextDimensions(selectedObj.lines[0], selectedObj.font, selectedObj.size);
                            selectedObj._computedWidth = dims.width;
                            selectedObj._computedHeight = dims.height;
                            selectedObj._handles = null;
                            drawTransformHandles(selectedObj, dims.width, dims.height);
                        } else {
                            selectedObj._handles = null;
                            drawTransformHandles(selectedObj, selectedObj.width, selectedObj.height);
                        }
                        const handle = getHandleAt(x, y, selectedObj);
                        if (handle) {
                            transformMode = handle.type;
                            transformHandle = handle.handle || null;
                            startMouseX = x;
                            startMouseY = y;
                            startObjX = selectedObj.x;
                            startObjY = selectedObj.y;
                            startObjRot = selectedObj.rotation || 0;
                            if (selectedObj.type === 'text') {
                                const dims = getTextDimensions(selectedObj.lines[0], selectedObj.font, selectedObj.size);
                                startObjW = dims.width;
                                startObjH = dims.height;
                                startObjSize = selectedObj.size;
                            } else {
                                startObjW = selectedObj.width;
                                startObjH = selectedObj.height;
                            }
                            e.preventDefault();
                            return;
                        }
                    }
                }

                if (hitObj) {
                    if (editingId !== hitObj.id) startEditing(hitObj.id);
                    draggingItem = hitObj.id;
                    dragOffsetX = x - hitObj.x;
                    dragOffsetY = y - hitObj.y;
                    dragStartX = hitObj.x;
                    dragStartY = hitObj.y;
                    canvas.classList.add('dragging');
                    renderOverlay();
                    e.preventDefault();
                    return;
                }

                if (editingId !== null) deselectObject();
            }

            function onMouseMove(e) {
                const { x, y } = getCanvasCoords(e);

                if (transformMode === 'resize' && editingId !== null) {
                    const obj = objects.find(o => o.id === editingId);
                    if (!obj) return;
                    const dx = x - startMouseX;
                    const dy = y - startMouseY;
                    let newX = startObjX,
                        newY = startObjY,
                        newW = startObjW,
                        newH = startObjH;
                    const shift = e.shiftKey;

                    if (obj.type === 'text') {
                        const dragDist = Math.hypot(dx, dy);
                        const startDiag = Math.hypot(startObjW, startObjH);
                        if (startDiag > 0) {
                            let scaleFactor = 1 + dragDist / startDiag;
                            if (dx < 0 || dy < 0) scaleFactor = 1 - dragDist / startDiag;
                            scaleFactor = Math.max(0.2, Math.min(5, scaleFactor));
                            const newSize = Math.max(6, startObjSize * scaleFactor);
                            obj.size = newSize;
                            obj.x = startObjX;
                            obj.y = startObjY;
                        }
                    } else {
                        switch (transformHandle) {
                            case 'tl':
                                newX = startObjX + dx;
                                newY = startObjY + dy;
                                newW = startObjW - dx;
                                newH = startObjH - dy;
                                break;
                            case 'tr':
                                newY = startObjY + dy;
                                newW = startObjW + dx;
                                newH = startObjH - dy;
                                break;
                            case 'bl':
                                newX = startObjX + dx;
                                newW = startObjW - dx;
                                newH = startObjH + dy;
                                break;
                            case 'br':
                                newW = startObjW + dx;
                                newH = startObjH + dy;
                                break;
                            case 'tc':
                                newY = startObjY + dy;
                                newH = startObjH - dy;
                                break;
                            case 'bc':
                                newH = startObjH + dy;
                                break;
                            case 'ml':
                                newX = startObjX + dx;
                                newW = startObjW - dx;
                                break;
                            case 'mr':
                                newW = startObjW + dx;
                                break;
                            default:
                                break;
                        }
                        if (shift) {
                            const aspect = startObjW / startObjH;
                            if (Math.abs(dx) > Math.abs(dy)) {
                                newH = newW / aspect;
                            } else {
                                newW = newH * aspect;
                            }
                            const cx = startObjX + startObjW / 2;
                            const cy = startObjY + startObjH / 2;
                            if (transformHandle === 'tl' || transformHandle === 'tr' || transformHandle === 'bl' ||
                                transformHandle === 'br') {
                                newX = cx - newW / 2;
                                newY = cy - newH / 2;
                            }
                        }
                        newW = Math.max(10, newW);
                        newH = Math.max(10, newH);
                        obj.x = newX;
                        obj.y = newY;
                        obj.width = newW;
                        obj.height = newH;
                    }
                    renderOverlay();
                    e.preventDefault();
                    return;
                }

                if (transformMode === 'rotate' && editingId !== null) {
                    const obj = objects.find(o => o.id === editingId);
                    if (!obj) return;
                    let cx, cy;
                    if (obj.type === 'text') {
                        const dims = getTextDimensions(obj.lines[0], obj.font, obj.size);
                        cx = startObjX + dims.width / 2;
                        cy = startObjY + dims.height / 2;
                    } else {
                        cx = startObjX + startObjW / 2;
                        cy = startObjY + startObjH / 2;
                    }
                    const startAngle = Math.atan2(startMouseY - cy, startMouseX - cx);
                    const currentAngle = Math.atan2(y - cy, x - cx);
                    let deltaAngle = (currentAngle - startAngle) * 180 / Math.PI;
                    obj.rotation = startObjRot + deltaAngle;
                    renderOverlay();
                    e.preventDefault();
                    return;
                }

                if (draggingItem !== null) {
                    const obj = objects.find(o => o.id === draggingItem);
                    if (obj) {
                        obj.x = x - dragOffsetX;
                        obj.y = y - dragOffsetY;
                        renderOverlay();
                    }
                    e.preventDefault();
                    return;
                }

                if (editingId !== null) {
                    const selectedObj = objects.find(o => o.id === editingId);
                    if (selectedObj) {
                        if (selectedObj.type === 'text') {
                            const dims = getTextDimensions(selectedObj.lines[0], selectedObj.font, selectedObj.size);
                            selectedObj._computedWidth = dims.width;
                            selectedObj._computedHeight = dims.height;
                            selectedObj._handles = null;
                            drawTransformHandles(selectedObj, dims.width, dims.height);
                        } else {
                            selectedObj._handles = null;
                            drawTransformHandles(selectedObj, selectedObj.width, selectedObj.height);
                        }
                        const handle = getHandleAt(x, y, selectedObj);
                        if (handle) {
                            canvas.style.cursor = handle.type === 'rotate' ? 'grab' : 'pointer';
                            return;
                        }
                    }
                }
                const hit = findObjectAt(x, y);
                canvas.style.cursor = hit ? 'grab' : 'default';
            }

            function onMouseUp(e) {
                let changed = false;

                if (transformMode) {
                    const obj = objects.find(o => o.id === editingId);
                    if (obj) {
                        let currentW, currentH;
                        if (obj.type === 'text') {
                            const dims = getTextDimensions(obj.lines[0], obj.font, obj.size);
                            currentW = dims.width;
                            currentH = dims.height;
                        } else {
                            currentW = obj.width;
                            currentH = obj.height;
                        }
                        if (currentW !== startObjW || currentH !== startObjH || obj.rotation !== startObjRot) {
                            changed = true;
                        }
                    }
                    transformMode = null;
                    transformHandle = null;
                    renderOverlay();
                    e.preventDefault();
                }

                if (draggingItem !== null) {
                    const obj = objects.find(o => o.id === draggingItem);
                    if (obj) {
                        if (obj.x !== dragStartX || obj.y !== dragStartY) {
                            changed = true;
                        }
                    }
                    draggingItem = null;
                    canvas.classList.remove('dragging');
                    renderOverlay();
                    e.preventDefault();
                }

                if (changed) {
                    hasUnsavedChanges = true;
                }
            }

            function onDoubleClick(e) {
                e.preventDefault();
                const { x, y } = getCanvasCoords(e);
                const hit = findObjectAt(x, y);
                if (hit) startEditing(hit.id);
            }

            function onKeyDown(e) {
                if (editingId !== null && (e.key === 'Delete' || e.key === 'Backspace')) {
                    e.preventDefault();
                    deleteObject(editingId);
                }
                if (e.key === 'Escape' && editingId !== null) {
                    deselectObject();
                }
            }

            // ─── Touch swipe ───
            let touchStartedOnObject = false;

            function handleTouchStart(e) {
                if (!pdfjsDoc) return;
                const rect = canvas.getBoundingClientRect();
                const t = e.touches[0];
                const canvasX = (t.clientX - rect.left) * (canvas.width / rect.width);
                const canvasY = (t.clientY - rect.top) * (canvas.height / rect.height);

                let hitObj = findObjectAt(canvasX, canvasY);
                let handle = null;
                if (editingId !== null) {
                    const selectedObj = objects.find(o => o.id === editingId);
                    if (selectedObj) {
                        if (selectedObj.type === 'text') {
                            const dims = getTextDimensions(selectedObj.lines[0], selectedObj.font, selectedObj.size);
                            selectedObj._computedWidth = dims.width;
                            selectedObj._computedHeight = dims.height;
                            selectedObj._handles = null;
                            drawTransformHandles(selectedObj, dims.width, dims.height);
                        } else {
                            selectedObj._handles = null;
                            drawTransformHandles(selectedObj, selectedObj.width, selectedObj.height);
                        }
                        handle = getHandleAt(canvasX, canvasY, selectedObj);
                    }
                }

                if (hitObj || handle) {
                    touchStartedOnObject = true;
                    ignoreSwipe = true;
                    const mouseEvent = new MouseEvent('mousedown', {
                        clientX: t.clientX,
                        clientY: t.clientY,
                        bubbles: true,
                        cancelable: true
                    });
                    canvas.dispatchEvent(mouseEvent);
                } else {
                    touchStartedOnObject = false;
                    ignoreSwipe = false;
                    touchStartX = t.clientX;
                    touchStartY = t.clientY;
                    touchMoved = false;
                }
                e.preventDefault();
            }

            function handleTouchMove(e) {
                if (!pdfjsDoc) return;
                if (touchStartedOnObject) {
                    const t = e.touches[0];
                    const mouseEvent = new MouseEvent('mousemove', {
                        clientX: t.clientX,
                        clientY: t.clientY,
                        bubbles: true,
                        cancelable: true
                    });
                    window.dispatchEvent(mouseEvent);
                    e.preventDefault();
                } else if (!ignoreSwipe) {
                    const t = e.touches[0];
                    const deltaX = t.clientX - touchStartX;
                    const deltaY = t.clientY - touchStartY;
                    if (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10) {
                        touchMoved = true;
                        e.preventDefault();
                    }
                } else {
                    e.preventDefault();
                }
            }

            function handleTouchEnd(e) {
                if (!pdfjsDoc) return;
                if (touchStartedOnObject) {
                    const mouseEvent = new MouseEvent('mouseup', {
                        bubbles: true,
                        cancelable: true
                    });
                    window.dispatchEvent(mouseEvent);
                    touchStartedOnObject = false;
                    ignoreSwipe = false;
                } else if (!ignoreSwipe && touchMoved) {
                    const t = e.changedTouches[0];
                    const deltaX = t.clientX - touchStartX;
                    if (Math.abs(deltaX) > 50) {
                        if (deltaX < 0) {
                            if (currentPageIndex < pageCount - 1) {
                                currentPageIndex++;
                                deselectObject();
                                renderOverlay();
                            }
                        } else {
                            if (currentPageIndex > 0) {
                                currentPageIndex--;
                                deselectObject();
                                renderOverlay();
                            }
                        }
                    }
                }
                e.preventDefault();
            }

            // ─── Before Unload Warning ───
            window.addEventListener('beforeunload', (e) => {
                if (hasUnsavedChanges) {
                    e.preventDefault();
                    e.returnValue = '';
                }
            });

            // ─── Event Bindings ───

            uploadButton.addEventListener('click', () => fileInput.click());
            choosePdfBtn.addEventListener('click', () => fileInput.click());
            changePdfBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    loadPDF(e.target.files[0]);
                    fileInput.value = '';
                }
            });

            prevPageBtn.addEventListener('click', () => {
                if (currentPageIndex > 0) {
                    currentPageIndex--;
                    deselectObject();
                    renderOverlay();
                }
            });

            nextPageBtn.addEventListener('click', () => {
                if (currentPageIndex < pageCount - 1) {
                    currentPageIndex++;
                    deselectObject();
                    renderOverlay();
                }
            });

            saveBtn.addEventListener('click', savePDF);

            addImageBtn.addEventListener('click', () => imageFileInput.click());
            imageFileInput.addEventListener('change', (e) => {
                if (e.target.files[0]) { addImage(e.target.files[0]);
                    imageFileInput.value = ''; }
            });

            drawSignatureBtn.addEventListener('click', openModal);
            sigCloseBtn.addEventListener('click', closeModal);
            sigCancelBtn.addEventListener('click', closeModal);
            sigClearBtn.addEventListener('click', clearSignature);
            sigUndoBtn.addEventListener('click', undoSignature);
            sigConfirmBtn.addEventListener('click', confirmSignature);

            sigCanvas.addEventListener('mousedown', startDrawing);
            sigCanvas.addEventListener('mousemove', draw);
            sigCanvas.addEventListener('mouseup', stopDrawing);
            sigCanvas.addEventListener('mouseleave', stopDrawing);

            sigCanvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const t = e.touches[0];
                sigCanvas.dispatchEvent(new MouseEvent('mousedown', { clientX: t.clientX, clientY: t.clientY }));
            }, { passive: false });
            sigCanvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const t = e.touches[0];
                sigCanvas.dispatchEvent(new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY }));
            }, { passive: false });
            sigCanvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                sigCanvas.dispatchEvent(new MouseEvent('mouseup', {}));
            }, { passive: false });

            canvas.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('dblclick', onDoubleClick);
            window.addEventListener('keydown', onKeyDown);

            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
            canvas.addEventListener('touchcancel', (e) => {
                touchStartedOnObject = false;
                ignoreSwipe = false;
                const mouseEvent = new MouseEvent('mouseup', { bubbles: true, cancelable: true });
                window.dispatchEvent(mouseEvent);
                e.preventDefault();
            }, { passive: false });

            // ─── Initial state ───
            pdfLoaded = false;
            hasUnsavedChanges = false;
            updateUIState();
            setStatus('📄 Upload a PDF to get started');

            console.log('✅ PDF Editor – Insert & Objects sections grayed out until PDF is loaded');
        })();
    </script>
</body>
</html>
