<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PWA PDF Studio - Full Editor</title>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #121214;
      color: #f3f4f6;
    }
    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* HEADER TOOLBAR */
    header {
      padding: 8px 12px;
      background: #1f2023;
      border-bottom: 1px solid #2e3035;
      display: flex;
      gap: 8px 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      z-index: 20;
      flex-shrink: 0;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    button, label.file-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      min-height: 36px;
      touch-action: manipulation;
    }
    button:disabled, label.file-btn.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    input[type="file"] { display: none; }

    /* MAIN VIEWPORT CANVAS CONTAINER */
    main {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
      background: #18181b;
      touch-action: pan-x pan-y;
      position: relative;
    }

    #pdf-wrapper {
      position: relative;
      max-width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      background: #fff;
      border-radius: 4px;
      user-select: none;
      display: inline-block;
    }
    #pdf-canvas {
      display: block;
      max-width: 100%;
      max-height: calc(100dvh - 120px);
      width: auto;
      height: auto;
      object-fit: contain;
    }

    /* OVERLAY ANNOTATION OBJECTS Layer */
    #annotations-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .annotation-item {
      position: absolute;
      border: 2px dashed #2563eb;
      background: rgba(37, 99, 235, 0.05);
      cursor: move;
      touch-action: none;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .annotation-item.selected {
      border-style: solid;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
    }
    .annotation-content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
      word-break: break-word;
    }
    .annotation-content img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .annotation-content .text-render {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      line-height: 1.2;
    }

    /* Resize & Delete Handles */
    .item-handle-delete {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 24px;
      height: 24px;
      background: #ef4444;
      color: white;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      z-index: 10;
    }
    .item-handle-resize {
      position: absolute;
      bottom: -8px;
      right: -8px;
      width: 18px;
      height: 18px;
      background: #3b82f6;
      border: 2px solid #ffffff;
      border-radius: 4px;
      display: none;
      cursor: se-resize;
      touch-action: none;
      z-index: 10;
    }
    .annotation-item.selected .item-handle-delete,
    .annotation-item.selected .item-handle-resize {
      display: flex;
    }

    /* MODALS & FORMATTING CONTROLS */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-content {
      background: #27272a;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .form-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .form-row label {
      font-size: 13px;
      color: #a1a1aa;
      min-width: 80px;
    }
    input[type="text"], select {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      background: #18181b;
      color: white;
      font-size: 15px;
      flex: 1;
    }
    #sig-canvas {
      background: #ffffff;
      border-radius: 8px;
      width: 100%;
      height: 200px;
      touch-action: none;
    }
    .modal-actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .page-indicator {
      font-size: 13px;
      color: #a1a1aa;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      header {
        justify-content: center;
      }
      .btn-group {
        width: 100%;
        justify-content: space-between;
      }
      button, label.file-btn {
        flex: 1;
        padding: 6px 8px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="btn-group">
      <label class="file-btn">
        Open PDF
        <input type="file" id="file-input" accept="application/pdf" />
      </label>
      <button id="add-sig-btn" disabled>+ Signature</button>
      <button id="add-text-btn" disabled>+ Text</button>
      <label class="file-btn disabled" id="img-btn-label">
        + Image
        <input type="file" id="image-input" accept="image/png, image/jpeg" disabled />
      </label>
      <button id="save-btn" style="background:#16a34a;" disabled>Export PDF</button>
    </div>

    <div class="btn-group">
      <button id="prev-page" style="background:#3f3f46; flex: initial;" disabled>&lt;</button>
      <span class="page-indicator" id="page-num-display">Page 0 / 0</span>
      <button id="next-page" style="background:#3f3f46; flex: initial;" disabled>&gt;</button>
    </div>
  </header>

  <main id="main-container">
    <div id="pdf-wrapper">
      <canvas id="pdf-canvas"></canvas>
      <div id="annotations-layer"></div>
    </div>
  </main>

  <!-- Signature Modal -->
  <div class="modal" id="sig-modal">
    <div class="modal-content">
      <h3 style="margin:0;">Draw Signature</h3>
      <canvas id="sig-canvas"></canvas>
      <div class="modal-actions">
        <button id="clear-sig" style="background:#52525b;">Clear</button>
        <div class="btn-group" style="width: auto;">
          <button id="cancel-sig" style="background:#52525b;">Cancel</button>
          <button id="confirm-sig">Add Signature</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Text Input & Formatting Modal -->
  <div class="modal" id="text-modal">
    <div class="modal-content">
      <h3 style="margin:0;" id="text-modal-title">Text Properties</h3>
      
      <div class="form-row">
        <label>Text Content</label>
        <input type="text" id="text-input-field" placeholder="Enter text..." />
      </div>

      <div class="form-row">
        <label>Font Size</label>
        <select id="text-font-size">
          <option value="12">12 px (Small)</option>
          <option value="16" selected>16 px (Medium)</option>
          <option value="24">24 px (Large)</option>
          <option value="36">36 px (Extra Large)</option>
          <option value="48">48 px (Heading)</option>
        </select>
      </div>

      <div class="form-row">
        <label>Text Color</label>
        <select id="text-color">
          <option value="#000000" selected>Black</option>
          <option value="#ffffff">White</option>
          <option value="#dc2626">Red</option>
          <option value="#16a34a">Green</option>
          <option value="#2563eb">Blue</option>
        </select>
      </div>

      <div class="form-row">
        <label>Background</label>
        <select id="text-bg-color">
          <option value="transparent" selected>Transparent</option>
          <option value="#ffffff">Solid White (Mask)</option>
          <option value="#fef08a">Yellow Highlight</option>
          <option value="#18181b">Dark Box</option>
        </select>
      </div>

      <div class="form-row">
        <label>Style</label>
        <div class="btn-group" style="flex:1;">
          <button id="toggle-bold" type="button" style="background:#3f3f46; flex:1;">B</button>
          <button id="toggle-italic" type="button" style="background:#3f3f46; flex:1;"><i>I</i></button>
        </div>
      </div>

      <div class="modal-actions" style="justify-content: flex-end; margin-top: 10px;">
        <div class="btn-group" style="width: auto;">
          <button id="cancel-text" style="background:#52525b;">Cancel</button>
          <button id="confirm-text">Apply Text</button>
        </div>
      </div>
    </div>
  </div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let rawPdfBytes = null;
  let pdfDoc = null;
  let currentPageIndex = 1;
  let totalPages = 0;
  let signaturePad = null;

  // Persistent Annotation Store per page: map pageNum -> Array of Annotation Objects
  // { id, type: 'png'|'text', x, y, width, height, dataUrl, text, fontSize, color, bgColor, isBold, isItalic }
  const annotationsMap = new Map();
  let selectedAnnotationId = null;
  let editingTextAnnotationId = null;

  // Text Form State
  let textFormState = { isBold: false, isItalic: false };

  // DOM Elements
  const fileInput = document.getElementById('file-input');
  const imageInput = document.getElementById('image-input');
  const imgBtnLabel = document.getElementById('img-btn-label');
  const addSigBtn = document.getElementById('add-sig-btn');
  const addTextBtn = document.getElementById('add-text-btn');
  const saveBtn = document.getElementById('save-btn');
  const prevBtn = document.getElementById('prev-page');
  const nextBtn = document.getElementById('next-page');
  const pageDisplay = document.getElementById('page-num-display');
  
  const pdfCanvas = document.getElementById('pdf-canvas');
  const pdfWrapper = document.getElementById('pdf-wrapper');
  const annotationsLayer = document.getElementById('annotations-layer');
  const mainContainer = document.getElementById('main-container');

  // Modals
  const sigModal = document.getElementById('sig-modal');
  const sigCanvas = document.getElementById('sig-canvas');
  const clearSigBtn = document.getElementById('clear-sig');
  const cancelSigBtn = document.getElementById('cancel-sig');
  const confirmSigBtn = document.getElementById('confirm-sig');

  const textModal = document.getElementById('text-modal');
  const textInputField = document.getElementById('text-input-field');
  const textFontSize = document.getElementById('text-font-size');
  const textColor = document.getElementById('text-color');
  const textBgColor = document.getElementById('text-bg-color');
  const toggleBoldBtn = document.getElementById('toggle-bold');
  const toggleItalicBtn = document.getElementById('toggle-italic');
  const cancelTextBtn = document.getElementById('cancel-text');
  const confirmTextBtn = document.getElementById('confirm-text');

  // Load Main PDF
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    rawPdfBytes = await file.arrayBuffer();
    currentPageIndex = 1;
    annotationsMap.clear();
    await renderPdfDoc();
  });

  async function renderPdfDoc() {
    try {
      const loadingTask = pdfjsLib.getDocument({ data: rawPdfBytes.slice(0) });
      pdfDoc = await loadingTask.promise;
      totalPages = pdfDoc.numPages;
      await renderPage(currentPageIndex);
      updateControls();
    } catch (err) {
      console.error('Error rendering PDF:', err);
    }
  }

  async function renderPage(pageNumber) {
    const page = await pdfDoc.getPage(pageNumber);
    const viewport = page.getViewport({ scale: 2.0 });
    const context = pdfCanvas.getContext('2d');
    
    pdfCanvas.width = viewport.width;
    pdfCanvas.height = viewport.height;

    await page.render({ canvasContext: context, viewport: viewport }).promise;
    renderAnnotationsForPage(pageNumber);
  }

  function updateControls() {
    pageDisplay.textContent = `Page ${currentPageIndex} / ${totalPages}`;
    prevBtn.disabled = currentPageIndex <= 1;
    nextBtn.disabled = currentPageIndex >= totalPages;
    addSigBtn.disabled = false;
    addTextBtn.disabled = false;
    imageInput.disabled = false;
    imgBtnLabel.classList.remove('disabled');
    saveBtn.disabled = false;
  }

  // Navigation
  prevBtn.addEventListener('click', async () => {
    if (currentPageIndex > 1) {
      deselectAll();
      currentPageIndex--;
      await renderPage(currentPageIndex);
      updateControls();
    }
  });

  nextBtn.addEventListener('click', async () => {
    if (currentPageIndex < totalPages) {
      deselectAll();
      currentPageIndex++;
      await renderPage(currentPageIndex);
      updateControls();
    }
  });

  // ANNOTATION LAYER RENDERING & INTERACTION
  function getPageAnnotations(pageNum) {
    if (!annotationsMap.has(pageNum)) {
      annotationsMap.set(pageNum, []);
    }
    return annotationsMap.get(pageNum);
  }

  function renderAnnotationsForPage(pageNum) {
    annotationsLayer.innerHTML = '';
    const items = getPageAnnotations(pageNum);

    items.forEach(item => {
      const el = createAnnotationDOMElement(item);
      annotationsLayer.appendChild(el);
    });
  }

  function createAnnotationDOMElement(item) {
    const el = document.createElement('div');
    el.className = `annotation-item ${selectedAnnotationId === item.id ? 'selected' : ''}`;
    el.dataset.id = item.id;
    
    // Percent or pixel relative dimensions
    el.style.left = `${item.x}px`;
    el.style.top = `${item.y}px`;
    el.style.width = `${item.width}px`;
    el.style.height = `${item.height}px`;

    const contentDiv = document.createElement('div');
    contentDiv.className = 'annotation-content';

    if (item.type === 'png') {
      const img = document.createElement('img');
      img.src = item.dataUrl;
      contentDiv.appendChild(img);
    } else if (item.type === 'text') {
      const txt = document.createElement('div');
      txt.className = 'text-render';
      txt.textContent = item.text;
      txt.style.fontSize = `${item.fontSize || 16}px`;
      txt.style.color = item.color || '#000000';
      txt.style.backgroundColor = item.bgColor || 'transparent';
      txt.style.fontWeight = item.isBold ? 'bold' : 'normal';
      txt.style.fontStyle = item.isItalic ? 'italic' : 'normal';
      if (item.bgColor && item.bgColor !== 'transparent') {
        txt.style.padding = '2px 4px';
        txt.style.borderRadius = '2px';
      }
      contentDiv.appendChild(txt);
    }

    // Handles
    const deleteBtn = document.createElement('div');
    deleteBtn.className = 'item-handle-delete';
    deleteBtn.textContent = '✕';
    deleteBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      deleteAnnotation(item.id);
    });

    const resizeHandle = document.createElement('div');
    resizeHandle.className = 'item-handle-resize';
    enableResizing(resizeHandle, item, el);

    el.appendChild(contentDiv);
    el.appendChild(deleteBtn);
    el.appendChild(resizeHandle);

    enableDragging(el, item);

    // Click/Tap to select or edit
    el.addEventListener('pointerdown', (e) => {
      if (e.target.classList.contains('item-handle-delete') || e.target.classList.contains('item-handle-resize')) return;
      selectAnnotation(item.id);
    });

    // Double tap/click to re-edit text properties
    if (item.type === 'text') {
      el.addEventListener('dblclick', () => {
        openTextModalForEdit(item);
      });
    }

    return el;
  }

  function selectAnnotation(id) {
    selectedAnnotationId = id;
    const all = annotationsLayer.querySelectorAll('.annotation-item');
    all.forEach(el => {
      if (el.dataset.id === id) {
        el.classList.add('selected');
      } else {
        el.classList.remove('selected');
      }
    });
  }

  function deselectAll() {
    selectedAnnotationId = null;
    const all = annotationsLayer.querySelectorAll('.annotation-item');
    all.forEach(el => el.classList.remove('selected'));
  }

  mainContainer.addEventListener('pointerdown', (e) => {
    if (e.target === mainContainer || e.target === pdfCanvas || e.target === annotationsLayer) {
      deselectAll();
    }
  });

  function deleteAnnotation(id) {
    const items = getPageAnnotations(currentPageIndex);
    const idx = items.findIndex(i => i.id === id);
    if (idx !== -1) {
      items.splice(idx, 1);
      renderAnnotationsForPage(currentPageIndex);
    }
  }

  // DRAG LOGIC
  function enableDragging(el, item) {
    let isDragging = false;
    let startX, startY;

    const onPointerDown = (e) => {
      if (e.target.classList.contains('item-handle-resize') || e.target.classList.contains('item-handle-delete')) return;
      isDragging = true;
      startX = e.clientX - item.x;
      startY = e.clientY - item.y;
      el.setPointerCapture(e.pointerId);
    };

    const onPointerMove = (e) => {
      if (!isDragging) return;
      item.x = Math.max(0, Math.min(pdfCanvas.clientWidth - item.width, e.clientX - startX));
      item.y = Math.max(0, Math.min(pdfCanvas.clientHeight - item.height, e.clientY - startY));
      el.style.left = `${item.x}px`;
      el.style.top = `${item.y}px`;
    };

    const onPointerUp = (e) => {
      if (!isDragging) return;
      isDragging = false;
      try { el.releasePointerCapture(e.pointerId); } catch(err) {}
    };

    el.onpointerdown = onPointerDown;
    el.onpointermove = onPointerMove;
    el.onpointerup = onPointerUp;
  }

  // RESIZE LOGIC
  function enableResizing(handle, item, el) {
    let isResizing = false;
    let startWidth, startHeight, startX, startY;

    const onPointerDown = (e) => {
      e.stopPropagation();
      isResizing = true;
      startWidth = item.width;
      startHeight = item.height;
      startX = e.clientX;
      startY = e.clientY;
      handle.setPointerCapture(e.pointerId);
    };

    const onPointerMove = (e) => {
      if (!isResizing) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      item.width = Math.max(30, startWidth + dx);
      item.height = Math.max(20, startHeight + dy);

      el.style.width = `${item.width}px`;
      el.style.height = `${item.height}px`;
    };

    const onPointerUp = (e) => {
      if (!isResizing) return;
      isResizing = false;
      try { handle.releasePointerCapture(e.pointerId); } catch(err) {}
    };

    handle.onpointerdown = onPointerDown;
    handle.onpointermove = onPointerMove;
    handle.onpointerup = onPointerUp;
  }

  // 1. SIGNATURE MODAL HANDLERS
  addSigBtn.addEventListener('click', () => {
    sigModal.style.display = 'flex';
    const rect = sigCanvas.getBoundingClientRect();
    sigCanvas.width = rect.width;
    sigCanvas.height = rect.height;
    
    if (!signaturePad) {
      signaturePad = new SignaturePad(sigCanvas, { backgroundColor: 'rgba(255, 255, 255, 0)' });
    } else {
      signaturePad.clear();
    }
  });

  clearSigBtn.addEventListener('click', () => signaturePad.clear());
  cancelSigBtn.addEventListener('click', () => sigModal.style.display = 'none');

  confirmSigBtn.addEventListener('click', () => {
    if (signaturePad.isEmpty()) return alert('Please draw a signature first.');
    
    const newAnno = {
      id: 'sig_' + Date.now(),
      type: 'png',
      dataUrl: signaturePad.toDataURL('image/png'),
      x: (pdfCanvas.clientWidth / 2) - 70,
      y: (pdfCanvas.clientHeight / 2) - 30,
      width: 140,
      height: 60
    };

    getPageAnnotations(currentPageIndex).push(newAnno);
    sigModal.style.display = 'none';
    renderAnnotationsForPage(currentPageIndex);
    selectAnnotation(newAnno.id);
  });

  // 2. TEXT MODAL HANDLERS
  addTextBtn.addEventListener('click', () => {
    editingTextAnnotationId = null;
    document.getElementById('text-modal-title').textContent = 'Add Text Annotation';
    textInputField.value = '';
    textFormState = { isBold: false, isItalic: false };
    updateToggleBtnStyles();
    textModal.style.display = 'flex';
    setTimeout(() => textInputField.focus(), 50);
  });

  function openTextModalForEdit(item) {
    editingTextAnnotationId = item.id;
    document.getElementById('text-modal-title').textContent = 'Edit Text Annotation';
    textInputField.value = item.text;
    textFontSize.value = item.fontSize || 16;
    textColor.value = item.color || '#000000';
    textBgColor.value = item.bgColor || 'transparent';
    textFormState.isBold = !!item.isBold;
    textFormState.isItalic = !!item.isItalic;
    updateToggleBtnStyles();
    textModal.style.display = 'flex';
  }

  toggleBoldBtn.addEventListener('click', () => {
    textFormState.isBold = !textFormState.isBold;
    updateToggleBtnStyles();
  });

  toggleItalicBtn.addEventListener('click', () => {
    textFormState.isItalic = !textFormState.isItalic;
    updateToggleBtnStyles();
  });

  function updateToggleBtnStyles() {
    toggleBoldBtn.style.background = textFormState.isBold ? '#2563eb' : '#3f3f46';
    toggleItalicBtn.style.background = textFormState.isItalic ? '#2563eb' : '#3f3f46';
  }

  cancelTextBtn.addEventListener('click', () => textModal.style.display = 'none');

  confirmTextBtn.addEventListener('click', () => {
    const val = textInputField.value.trim();
    if (!val) return;

    const fSize = parseInt(textFontSize.value, 10);
    const items = getPageAnnotations(currentPageIndex);

    if (editingTextAnnotationId) {
      // Edit existing
      const item = items.find(i => i.id === editingTextAnnotationId);
      if (item) {
        item.text = val;
        item.fontSize = fSize;
        item.color = textColor.value;
        item.bgColor = textBgColor.value;
        item.isBold = textFormState.isBold;
        item.isItalic = textFormState.isItalic;
      }
    } else {
      // Create new
      const newAnno = {
        id: 'txt_' + Date.now(),
        type: 'text',
        text: val,
        fontSize: fSize,
        color: textColor.value,
        bgColor: textBgColor.value,
        isBold: textFormState.isBold,
        isItalic: textFormState.isItalic,
        x: (pdfCanvas.clientWidth / 2) - 80,
        y: (pdfCanvas.clientHeight / 2) - 20,
        width: Math.max(120, val.length * (fSize * 0.65)),
        height: fSize * 2
      };
      items.push(newAnno);
      editingTextAnnotationId = newAnno.id;
    }

    textModal.style.display = 'none';
    renderAnnotationsForPage(currentPageIndex);
    selectAnnotation(editingTextAnnotationId);
  });

  // 3. IMAGE INPUT HANDLER
  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      const newAnno = {
        id: 'img_' + Date.now(),
        type: 'png',
        dataUrl: event.target.result,
        x: (pdfCanvas.clientWidth / 2) - 60,
        y: (pdfCanvas.clientHeight / 2) - 60,
        width: 120,
        height: 120
      };
      getPageAnnotations(currentPageIndex).push(newAnno);
      renderAnnotationsForPage(currentPageIndex);
      selectAnnotation(newAnno.id);
      imageInput.value = '';
    };
    reader.readAsDataURL(file);
  });

  // CLEAN IMAGE UTILITY (Prevents PDF-Lib encoding crashes)
  function cleanPngDataUrl(dataUrl) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = img.width;
        tempCanvas.height = img.height;
        const ctx = tempCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        resolve(tempCanvas.toDataURL('image/png'));
      };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  // EXPORT / BAKE ALL PAGES INTO FINAL PDF
  saveBtn.addEventListener('click', async () => {
    if (!rawPdfBytes) return;

    deselectAll();
    saveBtn.disabled = true;
    saveBtn.textContent = 'Baking PDF...';

    try {
      const pdfLibDoc = await PDFLib.PDFDocument.load(rawPdfBytes);
      const pages = pdfLibDoc.getPages();
      const fontHelvetica = await pdfLibDoc.embedFont(PDFLib.StandardFonts.Helvetica);
      const fontHelveticaBold = await pdfLibDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
      const fontHelveticaOblique = await pdfLibDoc.embedFont(PDFLib.StandardFonts.HelveticaOblique);
      const fontHelveticaBoldOblique = await pdfLibDoc.embedFont(PDFLib.StandardFonts.HelveticaBoldOblique);

      const canvasWidth = pdfCanvas.getBoundingClientRect().width;
      const canvasHeight = pdfCanvas.getBoundingClientRect().height;

      for (let i = 0; i < pages.length; i++) {
        const pageNum = i + 1;
        const pageItems = annotationsMap.get(pageNum);
        if (!pageItems || pageItems.length === 0) continue;

        const targetPage = pages[i];
        const { width: pdfWidth, height: pdfHeight } = targetPage.getSize();

        // Scale factors between screen canvas view and PDF points
        const scaleX = pdfWidth / canvasWidth;
        const scaleY = pdfHeight / canvasHeight;

        for (const item of pageItems) {
          const finalPdfX = item.x * scaleX;
          const finalPdfWidth = item.width * scaleX;
          const finalPdfHeight = item.height * scaleY;
          const finalPdfY = pdfHeight - ((item.y + item.height) * scaleY);

          if (item.type === 'png') {
            const cleanImgData = await cleanPngDataUrl(item.dataUrl);
            const pngImage = await pdfLibDoc.embedPng(cleanImgData);
            targetPage.drawImage(pngImage, {
              x: finalPdfX,
              y: finalPdfY,
              width: finalPdfWidth,
              height: finalPdfHeight,
            });
          } else if (item.type === 'text') {
            // Draw background rectangle if colored/mask
            if (item.bgColor && item.bgColor !== 'transparent') {
              const bgRgb = hexToRgb(item.bgColor);
              targetPage.drawRectangle({
                x: finalPdfX,
                y: finalPdfY,
                width: finalPdfWidth,
                height: finalPdfHeight,
                color: PDFLib.rgb(bgRgb.r, bgRgb.g, bgRgb.b),
              });
            }

            // Select Font
            let selectedFont = fontHelvetica;
            if (item.isBold && item.isItalic) selectedFont = fontHelveticaBoldOblique;
            else if (item.isBold) selectedFont = fontHelveticaBold;
            else if (item.isItalic) selectedFont = fontHelveticaOblique;

            const textRgb = hexToRgb(item.color || '#000000');
            const pdfFontSize = (item.fontSize || 16) * scaleY;

            targetPage.drawText(item.text, {
              x: finalPdfX + (4 * scaleX),
              y: finalPdfY + (finalPdfHeight * 0.25),
              size: pdfFontSize,
              font: selectedFont,
              color: PDFLib.rgb(textRgb.r, textRgb.g, textRgb.b),
            });
          }
        }
      }

      // Generate blob & download
      const finalPdfBytes = await pdfLibDoc.save();
      const blob = new Blob([finalPdfBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `edited_document.pdf`;
      link.click();

    } catch (err) {
      console.error('PDF Export Error:', err);
      alert('Error exporting PDF document.');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Export PDF';
    }
  });

  // Utility RGB parser
  function hexToRgb(hex) {
    if (hex === 'transparent') return { r: 1, g: 1, b: 1 };
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    const num = parseInt(c, 16);
    return {
      r: ((num >> 16) & 255) / 255,
      g: ((num >> 8) & 255) / 255,
      b: (num & 255) / 255
    };
  }

  // Window Resize handling
  window.addEventListener('resize', () => {
    if (pdfDoc) {
      renderPage(currentPageIndex);
    }
  });
</script>
</body>
</html>
