<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PWA PDF Signature Tool</title>
  
  <!-- PDF.js for rendering PDF to canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- pdf-lib for embedding signature image into PDF -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- SignaturePad for touch/pen drawing -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 1rem;
      background: #2b2b36;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    button, input[type="file"] {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    main {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }
    #pdf-wrapper {
      position: relative;
      border: 1px solid #444;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    #pdf-canvas {
      display: block;
    }
    /* Modal for signing */
    #sig-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #2b2b36;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    #sig-canvas {
      background: #fff;
      border-radius: 6px;
      width: 100%;
      height: 200px;
      touch-action: none;
    }
    .modal-actions {
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <input type="file" id="file-input" accept="application/pdf" />
    <button id="add-sig-btn" disabled>Place Signature</button>
    <button id="save-btn" disabled>Save & Download PDF</button>
  </header>

  <main>
    <div id="pdf-wrapper">
      <canvas id="pdf-canvas"></canvas>
    </div>
  </main>

  <!-- Signature Modal -->
  <div id="sig-modal">
    <div class="modal-content">
      <h3>Draw Signature</h3>
      <canvas id="sig-canvas"></canvas>
      <div class="modal-actions">
        <button id="clear-sig">Clear</button>
        <div>
          <button id="cancel-sig" style="background:#6b7280;">Cancel</button>
          <button id="confirm-sig">Apply</button>
        </div>
      </div>
    </div>
  </div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let rawPdfBytes = null;
  let pdfDoc = null;
  let pdfPage = null;
  let signaturePad = null;
  let pendingSignatureImg = null;

  const fileInput = document.getElementById('file-input');
  const addSigBtn = document.getElementById('add-sig-btn');
  const saveBtn = document.getElementById('save-btn');
  const pdfCanvas = document.getElementById('pdf-canvas');
  const pdfWrapper = document.getElementById('pdf-wrapper');
  
  // Modal Elements
  const sigModal = document.getElementById('sig-modal');
  const sigCanvas = document.getElementById('sig-canvas');
  const clearSigBtn = document.getElementById('clear-sig');
  const cancelSigBtn = document.getElementById('cancel-sig');
  const confirmSigBtn = document.getElementById('confirm-sig');

  // Load PDF File
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    rawPdfBytes = await file.arrayBuffer();
    
    // Render first page with PDF.js
    const loadingTask = pdfjsLib.getDocument({ data: rawPdfBytes });
    pdfDoc = await loadingTask.promise;
    pdfPage = await pdfDoc.getPage(1);

    const viewport = pdfPage.getViewport({ scale: 1.5 });
    const context = pdfCanvas.getContext('2d');
    
    pdfCanvas.width = viewport.width;
    pdfCanvas.height = viewport.height;

    await pdfPage.render({ canvasContext: context, viewport: viewport }).promise;

    addSigBtn.disabled = false;
  });

  // Setup Signature Pad Modal
  addSigBtn.addEventListener('click', () => {
    sigModal.style.display = 'flex';
    // Setup pad resolution based on container
    const rect = sigCanvas.getBoundingClientRect();
    sigCanvas.width = rect.width;
    sigCanvas.height = rect.height;
    
    if (!signaturePad) {
      signaturePad = new SignaturePad(sigCanvas, { backgroundColor: 'rgba(255, 255, 255, 0)' });
    } else {
      signaturePad.clear();
    }
  });

  clearSigBtn.addEventListener('click', () => signaturePad.clear());
  cancelSigBtn.addEventListener('click', () => sigModal.style.display = 'none');

  confirmSigBtn.addEventListener('click', () => {
    if (signaturePad.isEmpty()) return alert('Please provide a signature.');
    
    pendingSignatureImg = signaturePad.toDataURL('image/png');
    sigModal.style.display = 'none';

    alert('Click anywhere on the PDF page to place your signature.');
    pdfCanvas.style.cursor = 'crosshair';
    pdfCanvas.addEventListener('click', handlePlaceSignature, { once: true });
  });

  // Core Math: Convert Click to True PDF Coordinates
  async function handlePlaceSignature(e) {
    if (!pendingSignatureImg) return;

    const rect = pdfCanvas.getBoundingClientRect();
    
    // 1. Get click relative to rendered CSS bounds
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    // 2. Load PDF with pdf-lib to get actual point dimensions
    const pdfLibDoc = await PDFLib.PDFDocument.load(rawPdfBytes);
    const firstPage = pdfLibDoc.getPages()[0];
    const { width: pdfWidth, height: pdfHeight } = firstPage.getSize();

    // 3. Compute Scaling Factor (DOM Canvas vs PDF Points)
    const scaleX = pdfWidth / rect.width;
    const scaleY = pdfHeight / rect.height;

    // Target dimensions for signature in PDF points
    const sigPdfWidth = 120;
    const sigPdfHeight = 50;

    // 4. Map top-left DOM click coordinates to bottom-left PDF coordinate system
    const targetPdfX = clickX * scaleX - (sigPdfWidth / 2);
    
    // Invert Y-Axis
    const targetPdfY = pdfHeight - (clickY * scaleY) - (sigPdfHeight / 2);

    // 5. Embed image into PDF
    const pngImage = await pdfLibDoc.embedPng(pendingSignatureImg);
    firstPage.drawImage(pngImage, {
      x: targetPdfX,
      y: targetPdfY,
      width: sigPdfWidth,
      height: sigPdfHeight,
    });

    // 6. Save modified PDF back to memory
    rawPdfBytes = await pdfLibDoc.save();

    // Re-render PDF preview to show placed signature
    const loadingTask = pdfjsLib.getDocument({ data: rawPdfBytes });
    pdfDoc = await loadingTask.promise;
    pdfPage = await pdfDoc.getPage(1);
    
    const viewport = pdfPage.getViewport({ scale: 1.5 });
    const context = pdfCanvas.getContext('2d');
    await pdfPage.render({ canvasContext: context, viewport: viewport }).promise;

    pdfCanvas.style.cursor = 'default';
    saveBtn.disabled = false;
    pendingSignatureImg = null;
  }

  // Download PDF
  saveBtn.addEventListener('click', () => {
    const blob = new Blob([rawPdfBytes], { type: 'application/pdf' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'signed-document.pdf';
    link.click();
  });
</script>
</body>
</html>
